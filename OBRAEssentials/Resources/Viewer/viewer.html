<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Viewer</title>
<style>
    :root {
        --top: calc(max(env(safe-area-inset-top), 10px) + 58px);
        --bottom: max(env(safe-area-inset-bottom), 10px);
        --glass: rgba(26, 28, 34, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --ink: #eef1f6;
        --muted: #9aa3b2;
        --accent: #3d7bff;
        --accent-soft: rgba(61, 123, 255, 0.22);
        --pick: #4f8cff;
        font: 14px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0e11; color: var(--ink);
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
        -webkit-tap-highlight-color: transparent; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; outline: none; }
    /* The engine adds its own plain progress text; the app shows a native one instead. */
    #stage > div { display: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; visibility: hidden; }
    #ui.on { visibility: visible; }
    #ui > * { pointer-events: auto; }
    #dims { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    #dims .dl { stroke: var(--pick); stroke-width: 2; fill: none; }
    #dims .dx { stroke: var(--pick); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; opacity: .85; }
    #dims .hl { stroke: var(--pick); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #dims .ax { stroke: #ffb648; stroke-width: 1.5; fill: none; stroke-dasharray: 10 4 2 4; }
    #dims .pt { fill: var(--pick); stroke: #fff; stroke-width: 1.5; }
    #dims .ah { fill: var(--pick); }
    #dims .lab rect { fill: #10131a; stroke: var(--pick); stroke-width: 1.2; }
    #dims .lab text { fill: #fff; font: 600 12px ui-monospace, Menlo, monospace; }

    /* View cube */
    #cubeWrap { position: absolute; left: 12px; top: var(--top); display: flex; gap: 8px; align-items: flex-start; }
    #cube { width: 76px; height: 76px; position: relative; }
    #cubeRot { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
    .face { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 0 0;
        display: grid; grid-template-columns: 22% 56% 22%; grid-template-rows: 22% 56% 22%;
        background: linear-gradient(160deg, #e9edf3, #c3cad6); border: 1px solid #8a93a3; box-sizing: border-box; }
    .face .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 700 8.5px/1 -apple-system, system-ui, sans-serif; letter-spacing: .02em; color: #3a4252; pointer-events: none; }
    .face > i { display: block; }
    .face > i.hot { background: rgba(61, 123, 255, .55); }
    .iconBtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass);
        color: var(--ink); display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .iconBtn svg { width: 18px; height: 18px; }
    .iconBtn:active { background: var(--accent-soft); }
    #tip { position: absolute; left: 12px; top: calc(var(--top) + 84px); padding: 4px 8px; border-radius: 6px;
        background: var(--glass); border: 1px solid var(--line); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #tip.on { opacity: 1; }

    /* Axis triad */
    #triad { position: absolute; left: 10px; width: 64px; height: 64px; bottom: calc(var(--bottom) + 62px); pointer-events: none; }
    #triad text { font: 700 10px -apple-system, system-ui, sans-serif; }

    /* Hint toast */
    #hint { position: absolute; left: 50%; transform: translateX(-50%); top: var(--top); max-width: min(78vw, 420px);
        padding: 8px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); text-align: center;
        font-size: 13px; color: var(--ink); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        transition: opacity .25s; pointer-events: none; margin-left: 40px; }
    #hint:empty { opacity: 0; }

    /* Bottom stack: result card, section bar, toolbar */
    #bottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--bottom); width: min(calc(100vw - 20px), 460px);
        display: flex; flex-direction: column; gap: 8px; align-items: stretch; pointer-events: none; }
    #bottom > * { pointer-events: auto; }
    .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
        -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
    #toolbar { display: flex; padding: 4px; gap: 2px; }
    #toolbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; border: 0;
        border-radius: 12px; background: transparent; color: var(--ink); font: 600 11px -apple-system, system-ui, sans-serif; }
    #toolbar button svg { width: 20px; height: 20px; }
    #toolbar button[aria-pressed="true"] { background: var(--accent-soft); color: #9cc0ff; }
    #toolbar .sep { width: 1px; background: var(--line); margin: 8px 2px; }
    #secBar { display: none; align-items: center; gap: 8px; padding: 8px 10px; }
    #secBar.on { display: flex; }
    #secBar .ax { min-width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); font: 700 13px -apple-system, system-ui, sans-serif; }
    #secBar .ax[aria-pressed="true"] { background: var(--accent-soft); color: #9cc0ff; }
    #secBar input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); height: 30px; }
    #secVal { font: 600 12px ui-monospace, Menlo, monospace; min-width: 84px; text-align: right; color: var(--muted); white-space: nowrap; }
    #card { display: none; padding: 12px 14px; position: relative; max-height: 42vh; overflow-y: auto; }
    #card.on { display: block; }
    #card .k { font-size: 12px; color: var(--muted); }
    #card .big { font: 700 30px/1.1 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; margin: 2px 0 2px; }
    #card .big small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 3px; }
    #card .sub { font-size: 13px; color: var(--muted); }
    #card .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
    #card .row b { font: 600 13px ui-monospace, Menlo, monospace; white-space: nowrap; }
    #card .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    #card .grid div { padding: 6px 10px; border-left: 1px solid var(--line); }
    #card .grid div:first-child { border-left: 0; }
    #card .grid span { display: block; font-size: 11px; color: var(--muted); }
    #card .grid b { font: 600 13px ui-monospace, Menlo, monospace; }
    #card .x { position: absolute; right: 8px; top: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
    <svg id="dims"></svg>
    <div id="cubeWrap">
        <div id="cube"><div id="cubeRot"></div></div>
        <button class="iconBtn" id="homeBtn" aria-label="Home view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        </button>
    </div>
    <div id="tip"></div>
    <svg id="triad" viewBox="-32 -32 64 64"></svg>
    <div id="hint"></div>
    <div id="bottom">
        <div id="card" class="glass"></div>
        <div id="secBar" class="glass">
            <span style="font-size:12px;color:var(--muted)">Section</span>
            <button class="ax" data-axis="x">X</button>
            <button class="ax" data-axis="y">Y</button>
            <button class="ax" data-axis="z">Z</button>
            <button class="ax" id="secFlip" aria-label="Flip the cut">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"/><path d="M12 4v4M9 6l3-3 3 3"/><path d="M12 20v-4M9 18l3 3 3-3"/></svg>
            </button>
            <input type="range" id="secSlider" min="0" max="1000" value="500" aria-label="Cut position">
            <span id="secVal"></span>
        </div>
        <div id="toolbar" class="glass">
            <button data-tool="inspect" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l13 7-6 1.6L9.5 18z"/></svg>Inspect</button>
            <button data-tool="measure" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="8" rx="1.5" transform="rotate(-35 12 12)"/><path d="M8.6 9.5l1.3 1.8M11.4 7.5l1.3 1.8M14.2 5.6l1.3 1.8"/></svg>Measure</button>
            <button data-tool="section" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 14l10-10M8 20l12-12M14 20l6-6"/></svg>Section</button>
            <span class="sep"></span>
            <button data-tool="frame" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>Frame</button>
        </div>
    </div>
</div>
<script src="o3dv.min.js"></script>
<script src="libs/three-lite.js"></script>
<script src="dxf.js"></script>
<script src="libs/fzstd.js"></script>
<script src="blend.js"></script>
<script src="viewer.js"></script>
<script src="tools.js"></script>
</body>
</html>
